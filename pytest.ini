[pytest]
testpaths = Day03_Pytest_Framework
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

markers =
    smoke: Critical smoke tests
    sanity: Focused sanity tests
    regression: Regression test cases
    login: Login-related test cases
    content_ai: Content AI tests
    practice_ai: Practice AI tests
    review_ai: Review AI tests